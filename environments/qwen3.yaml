name: qwen3
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Build string pinned exactly, not just the version + channel prefix: relying on
  # the pytorch:: prefix alone is untested for `conda install` on the command line
  # (as opposed to `conda env create -f`) — pin the exact build to remove any doubt,
  # matching parakeet.yaml's proven-working spec.
  - pytorch::pytorch=2.5.1=py3.10_cuda11.8_cudnn9.1.0_0
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchaudio=2.5.1=py310_cu118
  - pip
  - pip:
      - qwen-asr
      - datasets==3.6.0
      - pandas==2.2.3
      - tqdm==4.67.1
      - librosa==0.11.0
      - numpy==1.26.4
      - num2words==0.5.14
      # Decodes bytes-stored audio (Svarah) via utils.io_helpers.decode_audio_value.
      - soundfile==0.13.1
