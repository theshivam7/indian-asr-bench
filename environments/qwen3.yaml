name: qwen3
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Build string pinned exactly (not just the version): an unpinned spec let the
  # solver pick conda-forge's CPU-only build instead of the pytorch channel's CUDA one.
  - pytorch::pytorch=2.5.1=py3.10_cuda11.8_cudnn9.1.0_0
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchaudio=2.5.1=py310_cu118
  - pip
  - pip:
      - qwen-asr==0.0.6
      - transformers==4.57.6
      - jiwer==4.0.0
      # 4.x is required to read a cache written by datasets 4.x: the List feature type
      # it introduced is unknown to 3.x, which fails with "Feature type 'List' not
      # found". Audio decoding still works without torchcodec at this version.
      - datasets==4.8.5
      - pandas==2.2.3
      - tqdm==4.67.1
      - librosa==0.11.0
      - numpy==1.26.4
      - num2words==0.5.14
      # Decodes bytes-stored audio (Svarah) via utils.io_helpers.decode_audio_value.
      - soundfile==0.13.1
