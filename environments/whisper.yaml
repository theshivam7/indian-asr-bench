name: whisper
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - conda-forge::ffmpeg
  # torch installed via conda (matching parakeet.yaml/qwen3.yaml's proven-working
  # pytorch-cuda=11.8 build), a pip-installed torch wheel (bare or +cu118) does NOT
  # reliably see the GPU on this cluster; torch.cuda.is_available() silently returns
  # False either way. Build string pinned exactly (not just the version) because an
  # unpinned `conda install -c pytorch -c conda-forge pytorch=2.5.1` let the solver
  # silently pick conda-forge's CPU-only build instead of the pytorch channel's CUDA one.
  - pytorch::pytorch=2.5.1=py3.10_cuda11.8_cudnn9.1.0_0
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchaudio=2.5.1=py310_cu118
  - pip:
      - openai-whisper==20250625
      # 4.x is required to read a cache written by datasets 4.x: the List feature type
      # it introduced is unknown to 3.x, which fails with "Feature type 'List' not
      # found". Audio decoding still works without torchcodec at this version.
      - datasets==4.8.5
      - jiwer==3.1.0
      - pandas==2.2.3
      - tqdm==4.67.1
      - librosa==0.11.0
      - numpy==1.26.4
      - num2words==0.5.14
      - matplotlib==3.10.3
      - whisper_normalizer==0.1.0   # Stage 2 whisper_norm mode + Stage 3 run in this env
      # Decodes bytes-stored audio (Svarah) via utils.io_helpers.decode_audio_value.
      # pip wheels bundle libsndfile>=1.2 (mp3-capable), no ffmpeg/torchcodec needed.
      - soundfile==0.13.1
